name: Beauty legacy transition checks
on:
  push:
    branches: [main]
    paths:
      - 'lojas/**'
      - 'beauty-central/**'
      - 'central-caseirinho-insights/index.html'
      - 'tests/beauty-migration-20261121.test.js'
      - '.github/workflows/beauty-app-smoke.yml'
  pull_request:
    branches: [main]
jobs:
  migration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir segurança da transição e preservação de rascunhos
        run: node --test tests/beauty-migration-20261121.test.js
