<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar macarrões · John ERP</title><style>body{font-family:Arial,sans-serif;background:#f6f7fb;color:#172033;margin:0;padding:24px}.box{max-width:780px;margin:40px auto;background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:24px;box-shadow:0 12px 40px #10233a12}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#0f5132;color:#fff}.secondary{background:#334155;margin-left:8px}pre{white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:10px;border:1px solid #e2e8f0}.ok{color:#166534}.err{color:#991b1b}.note{color:#475569;font-size:14px}</style></head><body><div class="box"><h1>Recuperar macarrões no ERP</h1><p>Recupera produtos de macarrão/talharim que continuam publicados na Loja, mas desapareceram do cadastro local do ERP.</p><p class="note">Correção V8.22.25.1: grava diretamente na base multiempresa <b>john:caseirinho:pcp_app_v1</b>, usada pelo ERP atual.</p><button id="run">Recuperar agora</button><button id="diag" class="secondary">Diagnóstico</button><pre id="out">Pronto para verificar.</pre><p><a href="./">Voltar ao ERP</a></p></div><script>(function(){'use strict';const S=v=>String(v??''),A=v=>Array.isArray(v)?v:[],N=v=>Number(v)||0,norm=v=>S(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),out=document.getElementById('out');function log(t,ok){out.className=ok===true?'ok':ok===false?'err':'';out.textContent=t}function clone(v){try{return JSON.parse(JSON.stringify(v))}catch(_){return v}}function urlSlug(){try{return new URLSearchParams(location.search).get('empresa')||new URLSearchParams(location.search).get('tenant')||''}catch(_){return''}}function activeSlug(){return norm(urlSlug()||localStorage.getItem('john_active_tenant_v1')||'caseirinho').replace(/[^a-z0-9-]/g,'-')||'caseirinho'}function scoped(slug,key){return 'john:'+slug+':'+key}function rawJson(key,fallback=null){try{const v=localStorage.getItem(key);if(v===null)return fallback;return JSON.parse(v)}catch(_){return fallback}}function cloudCfg(slug){return rawJson(scoped(slug,'john_cloud_config_v1'),null)||rawJson('john_cloud_config_v1',{})||{}}function cfg(){const slug=activeSlug(),c=cloudCfg(slug);return{slug,api:S(c.apiUrl||'https://john-cloud-api-production.up.railway.app').replace(/\/+$/,''),dbKey:scoped(slug,'pcp_app_v1')}}function isMac(p){return /macarrao|talharim/.test(norm([p?.nome,p?.nomeComercial,p?.gradeNome,p?.categoria,p?.descricao,p?.variacaoLabel].filter(Boolean).join(' ')))}function match(db,p){const id=S(p?.id||p?.produtoId),code=S(p?.codigo);return A(db.produtos).find(x=>S(x?.id)===id)||A(db.produtos).find(x=>code&&S(x?.codigo)===code)}function copyGrade(t,p){for(const k of ['gradeId','gradeNome','gradeDescricao','gradeProdutoCapaId','gradeTipoOpcao','gradeTituloOpcao','gradePluralOpcao','variacaoId','variacaoLabel','variacaoOrdem'])if(p?.[k]!==undefined)t[k]=clone(p[k])}function restore(db,p){const ts=new Date().toISOString(),e={publicar:true,categoriaId:S(p?.categoriaId||''),categoria:S(p?.categoria||''),nomeComercial:S(p?.nomeComercial||p?.nome||''),descricao:S(p?.descricao||''),precoEcommerce:N(p?.precoEcommerce||p?.preco),precoModo:S(p?.precoModo||'ECOMMERCE'),precoOrigem:S(p?.precoOrigem||'ECOMMERCE'),quantidadeMinima:Math.max(.0001,N(p?.quantidadeMinima)||1),limitePedido:Math.max(0,N(p?.limitePedido)),disponibilidade:S(p?.disponibilidade||'AMBOS'),antecedenciaDias:Math.max(0,Math.round(N(p?.antecedenciaDias))),destaque:p?.destaque===true,novidade:p?.novidade===true,imagem:S(p?.imagem||''),imagens:A(p?.imagens).filter(Boolean)};copyGrade(e,p);const x={id:S(p?.id||p?.produtoId),codigo:S(p?.codigo||''),nome:S(p?.nome||p?.nomeComercial||'Macarrão recuperado'),status:'ATIVO',ativo:true,unidade:S(p?.unidade||'UN'),gtin:S(p?.gtin||''),plu:S(p?.plu||''),temCaixa:false,embalagem:S(p?.embalagem||''),fator:N(p?.fator)||1,custoInicial:N(p?.custoInicial||p?.custo),precoVenda:N(p?.precoVenda||p?.preco),margem:N(p?.margem),tipos:A(p?.tipos).length?clone(p.tipos):['Produto acabado'],associados:A(p?.associados),anexos:A(p?.anexos),obs:S(p?.obs||p?.descricao||''),criadoEm:ts,atualizadoEm:ts,operadorAtualizacao:'Recuperação V8.22.25.1',ecommerce:e};copyGrade(x,p);db.produtos.push(x);return x}function persistAll(c,db){const text=JSON.stringify(db);localStorage.setItem(c.dbKey,text);localStorage.setItem('pcp_app_v1',text);return true}async function fetchCatalog(c){const r=await fetch(c.api+'/api/v1/public/store/'+encodeURIComponent(c.slug)+'/catalog?_recover='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-store'}});if(!r.ok)throw new Error('Catálogo da Loja respondeu HTTP '+r.status);return r.json()}function loadDb(c){let db=rawJson(c.dbKey,null);let source=c.dbKey;if(!db||typeof db!=='object'){db=rawJson('pcp_app_v1',null);source='pcp_app_v1 (legado)'}if(!db||typeof db!=='object')throw new Error('Base do ERP não encontrada. Abra primeiro o ERP neste mesmo navegador e depois volte a esta página.');db.produtos=A(db.produtos);return{db,source}}async function run(){try{const c=cfg();log('Consultando Loja e base '+c.dbKey+'...');const cat=await fetchCatalog(c),loaded=loadDb(c),db=loaded.db;const published=A(cat.produtos).filter(isMac),recovered=[];for(const p of published){if(!match(db,p))recovered.push(restore(db,p))}db.config=db.config&&typeof db.config==='object'?db.config:{};db.config.ecommerce=db.config.ecommerce&&typeof db.config.ecommerce==='object'?db.config.ecommerce:{};db.config.ecommerce.grades=A(db.config.ecommerce.grades);const wanted=new Set([...published,...recovered].map(p=>S(p.gradeId||p.ecommerce?.gradeId)).filter(Boolean));let grades=0;for(const g of A(cat?.loja?.grades)){const id=S(g?.id);if(id&&wanted.has(id)&&!db.config.ecommerce.grades.some(x=>S(x?.id)===id)){db.config.ecommerce.grades.push(clone(g));grades++}}persistAll(c,db);const localMac=A(db.produtos).filter
