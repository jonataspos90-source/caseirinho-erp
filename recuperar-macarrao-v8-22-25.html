<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar macarrões · John ERP</title><style>body{font-family:Arial,sans-serif;background:#f6f7fb;color:#172033;margin:0;padding:24px}.box{max-width:760px;margin:40px auto;background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:24px;box-shadow:0 12px 40px #10233a12}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#0f5132;color:#fff}pre{white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:10px;border:1px solid #e2e8f0}.ok{color:#166534}.err{color:#991b1b}</style></head><body><div class="box"><h1>Recuperar macarrões no ERP</h1><p>Recupera somente produtos de macarrão/talharim que ainda constam no catálogo público da Loja, mas desapareceram do cadastro local do ERP. Não duplica produtos existentes.</p><button id="run">Recuperar agora</button><pre id="out">Pronto para verificar.</pre><p><a href="./">Voltar ao ERP</a></p></div><script>(function(){'use strict';const S=v=>String(v??''),A=v=>Array.isArray(v)?v:[],N=v=>Number(v)||0,norm=v=>S(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),out=document.getElementById('out');function log(t,ok){out.className=ok===true?'ok':ok===false?'err':'';out.textContent=t}function clone(v){try{return JSON.parse(JSON.stringify(v))}catch(_){return v}}function cfg(){let c={};try{c=JSON.parse(localStorage.getItem('john_cloud_config_v1')||'{}')||{}}catch(_){}return{api:S(c.apiUrl||'https://john-cloud-api-production.up.railway.app').replace(/\/+$/,''),slug:S(c.storeSlug||'caseirinho')||'caseirinho'}}function isMac(p){return /macarrao|talharim/.test(norm([p?.nome,p?.nomeComercial,p?.gradeNome,p?.categoria,p?.descricao].filter(Boolean).join(' ')))}function match(db,p){const id=S(p?.id||p?.produtoId),code=S(p?.codigo);return A(db.produtos).find(x=>S(x?.id)===id)||A(db.produtos).find(x=>code&&S(x?.codigo)===code)}function copyGrade(t,p){for(const k of ['gradeId','gradeNome','gradeDescricao','gradeProdutoCapaId','gradeTipoOpcao','gradeTituloOpcao','gradePluralOpcao','variacaoId','variacaoLabel','variacaoOrdem'])if(p?.[k]!==undefined)t[k]=clone(p[k])}function restore(db,p){const ts=new Date().toISOString(),e={publicar:true,categoriaId:S(p?.categoriaId||''),categoria:S(p?.categoria||''),nomeComercial:S(p?.nomeComercial||p?.nome||''),descricao:S(p?.descricao||''),precoEcommerce:N(p?.precoEcommerce||p?.preco),precoModo:S(p?.precoModo||'ECOMMERCE'),precoOrigem:S(p?.precoOrigem||'ECOMMERCE'),quantidadeMinima:Math.max(.0001,N(p?.quantidadeMinima)||1),limitePedido:Math.max(0,N(p?.limitePedido)),disponibilidade:S(p?.disponibilidade||'AMBOS'),antecedenciaDias:Math.max(0,Math.round(N(p?.antecedenciaDias))),destaque:p?.destaque===true,novidade:p?.novidade===true,imagem:S(p?.imagem||''),imagens:A(p?.imagens).filter(Boolean)};copyGrade(e,p);const x={id:S(p?.id||p?.produtoId),codigo:S(p?.codigo||''),nome:S(p?.nome||p?.nomeComercial||'Macarrão recuperado'),status:'ATIVO',unidade:S(p?.unidade||'UN'),gtin:S(p?.gtin||''),plu:S(p?.plu||''),temCaixa:false,embalagem:'',fator:1,custoInicial:0,precoVenda:N(p?.precoVenda||p?.preco),margem:0,tipos:A(p?.tipos).length?clone(p.tipos):['Produto acabado'],associados:[],anexos:[],obs:S(p?.descricao||''),criadoEm:ts,atualizadoEm:ts,operadorAtualizacao:'Recuperação V8.22.25',ecommerce:e};copyGrade(x,p);db.produtos.push(x);return x}async function run(){try{log('Consultando a Loja e o cadastro local...');const c=cfg(),r=await fetch(c.api+'/api/v1/public/store/'+encodeURIComponent(c.slug)+'/catalog?_recover='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Catálogo da Loja respondeu HTTP '+r.status);const cat=await r.json();let db=JSON.parse(localStorage.getItem('pcp_app_v1')||'null');if(!db||typeof db!=='object')throw new Error('Base local pcp_app_v1 não encontrada neste navegador. Abra o ERP normalmente neste aparelho e tente novamente.');db.produtos=A(db.produtos);const recovered=[];for(const p of A(cat.produtos)){if(isMac(p)&&!match(db,p)){recovered.push(restore(db,p))}}db.config=db.config&&typeof db.config==='object'?db.config:{};db.config.ecommerce=db.config.ecommerce&&typeof db.config.ecommerce==='object'?db.config.ecommerce:{};db.config.ecommerce.grades=A(db.config.ecommerce.grades);const wanted=new Set(recovered.map(p=>S(p.gradeId||p.ecommerce?.gradeId)).filter(Boolean));let grades=0;for(const g of A(cat?.loja?.grades)){const id=S(g?.id);if(id&&wanted.has(id)&&!db.config.ecommerce.grades.some(x=>S(x?.id)===id)){db.config.ecommerce.grades.push(clone(g));grades++}}localStorage.setItem('pcp_app_v1',JSON.stringify(db));if(!recovered.length){log('Nenhum macarrão publicado está ausente do cadastro local. Nada foi alterado.',true);return}log('Recuperação concluída.\n\nProdutos recuperados: '+recovered.length+'\nGrades recuperadas: '+grades+'\n\n'+recovered.map(p=>'• '+p.nome+(p.ecommerce?.variacaoLabel?' · '+p.ecommerce.variacaoLabel:'')).join('\n')+'\n\nAgora volte ao ERP, abra Cadastro de Produtos/Grade e faça a manutenção. Ao salvar, a sincronização normal do ERP poderá enviar as alterações para a nuvem.',true)}catch(e){log('Falha na recuperação: '+(e?.message||e),false)}}document.getElementById('run').onclick=run})();</script></body></html>
